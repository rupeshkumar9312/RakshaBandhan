  <ellipse cx="800" cy="248" rx="88.2" ry="63" fill="#faf2d6" opacity="0.65" transform="rotate(0 800 500)"/><ellipse cx="800" cy="248" rx="88.2" ry="63" fill="#faf2d6" opacity="0.65" transform="rotate(45 800 500)"/><ellipse cx="800" cy="248" rx="88.2" ry="63" fill="#faf2d6" opacity="0.65" transform="rotate(90 800 500)"/><ellipse cx="800" cy="248" rx="88.2" ry="63" fill="#faf2d6" opacity="0.65" transform="rotate(135 800 500)"/><ellipse cx="800" cy="248" rx="88.2" ry="63" fill="#faf2d6" opacity="0.65" transform="rotate(180 800 500)"/><ellipse cx="800" cy="248" rx="88.2" ry="63" fill="#faf2d6" opacity="0.65" transform="rotate(225 800 500)"/><ellipse cx="800" cy="248" rx="88.2" ry="63" fill="#faf2d6" opacity="0.65" transform="rotate(270 800 500)"/><ellipse cx="800" cy="248" rx="88.2" ry="63" fill="#faf2d6" opacity="0.65" transform="rotate(315 800 500)"/>

