<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#855720"/>
      <stop offset="100%" stop-color="#5a3a1e"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf2d6"/>
      <stop offset="50%" stop-color="#c9962e"/>
      <stop offset="100%" stop-color="#faf2d6"/>
    </linearGradient>
    <linearGradient id="cord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f1638" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#8f1638"/>
      <stop offset="100%" stop-color="#8f1638" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- ambient glow -->
  <circle cx="800" cy="500" r="441" fill="#c9962e" opacity="0.16" filter="url(#soft)"/>

  <!-- decorative corner arcs -->
