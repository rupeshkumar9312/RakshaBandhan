    <circle cx="800" cy="500" r="525"/>
    <circle cx="800" cy="500" r="651" stroke-dasharray="6 14"/>
  </g>

  <!-- silk cord -->
  <path d="M0 500 Q 400 454 800 500 T 1600 500"
